<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>ExamLite</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header class="page-header">
        <div class="brand">
            <div class="logo">ExamLite</div>
            <div class="tagline">Simple study planning — get organised, not overwhelmed.</div>
        </div>
        <div class="header-graphic" aria-hidden="true"></div>
    </header>
    <div class="layout">
        <section class="panel">
            <h2>Add a Subject</h2>
            <div class="form-row"><label for="subject">Subject Name</label><input type="text" id="subject" placeholder="e.g. Calculus" required></div>
            <div class="form-row"><label for="cu">Credit Units</label><input type="number" id="cu" min="1" placeholder="3" required></div>
            <div class="form-row"><label for="priority">Priority</label><select id="priority"><option>High</option><option>Medium</option><option>Low</option></select></div>
            <div class="form-row"><label for="exam">Exam Date</label><input type="date" id="exam" required></div>
            <div class="form-actions">
                <button id="addBtn">
                    <svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M11 11V5h2v6h6v2h-6v6h-2v-6H5v-2h6z" fill="currentColor"/></svg>
                    <span>Add Subject</span>
                </button>
                <button id="cancelBtn" class="secondary" type="button" style="display:none;">
                    <svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M6 6l12 12M6 18L18 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    <span>Cancel Edit</span>
                </button>
            </div>
            <div id="messageBox" class="message" style="display:none;"></div>
        </section>
        <section class="panel">
            <h2>Dashboard</h2>
            <div class="stats">
                <div class="stat-card stat-total"><span class="stat-icon">📚</span><span>Total Subjects</span><strong id="totalSubjects">0</strong></div>
                <div class="stat-card stat-high"><span class="stat-icon">🔥</span><span>High Priority</span><strong id="highSubjects">0</strong></div>
                <div class="stat-card stat-next"><span class="stat-icon">⏳</span><span>Nearest Exam</span><strong id="nearestExam">None</strong></div>
            </div>
            <h2>Study Recommendations</h2>
            <div class="button-row">
                <button id="planBtn">
                    <svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M3 7h18M8 3v4M16 3v4M5 21h14a2 2 0 002-2V7H3v12a2 2 0 002 2z" fill="currentColor"/></svg>
                    <span>Generate Plan</span>
                </button>
                <button id="resetBtn" class="secondary" type="button">
                    <svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M21 12a9 9 0 11-3.2-6.4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M21 3v6h-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    <span>Reset All</span>
                </button>
            </div>
            <div id="planBox"></div>
        </section>
    </div>
    <section class="panel">
        <h2>Subjects</h2>
        <div id="subjectList"></div>
    </section>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
